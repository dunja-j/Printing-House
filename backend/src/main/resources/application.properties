spring.application.name=backend
server.port=8080

# Baza se kreira iskljucivo preko database/printing_house_db.sql (videti copilot-instructions.md)
spring.datasource.url=jdbc:mysql://localhost:3306/printing_house?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Belgrade
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# sesija istice posle 30 minuta neaktivnosti
server.servlet.session.timeout=30m

# folder sa uploadovanim slikama (relativno u odnosu na backend/), servira se na /uploads/**
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
